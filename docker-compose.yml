version: '3.8'

# ==============================================================================
# Docker Compose Configuration for Local Development & Testing
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus_complaint_portal
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-campus-complaint-system-docker-dev-key
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - PORT=8000
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4"
